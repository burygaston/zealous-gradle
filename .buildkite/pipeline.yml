env:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.parallel=true"
  BUILDKITE_ANALYTICS_TOKEN: "VXzdR2LfZPQ93FXXetcCcsJW"

steps:
  - label: ":gradle: Build Project (Local)"
    key: "build"
    agents:
      queue: "default"  # Self-hosted/local agent
    command: |
      echo "--- :computer: Agent Information"
      echo "Queue: ${BUILDKITE_AGENT_META_DATA_QUEUE:-default}"
      echo "Agent: ${BUILDKITE_AGENT_NAME}"
      echo "Hostname: $(hostname)"
      echo "OS: $(uname -s)"
      echo "Working Directory: $(pwd)"

      echo "--- :mag: Gradle Cache Information (BEFORE)"
      echo "Gradle User Home: ${GRADLE_USER_HOME:-~/.gradle}"
      if [ -d ~/.gradle/caches ]; then
        echo "Gradle cache size: $(du -sh ~/.gradle/caches 2>/dev/null | cut -f1)"
        echo "Gradle cache entries: $(find ~/.gradle/caches -type f 2>/dev/null | wc -l)"
      else
        echo "No Gradle cache found - first build will download dependencies"
      fi

      echo "--- :package: Installing dependencies"
      echo "Running: ./gradlew dependencies"
      time ./gradlew dependencies --no-daemon

      echo "--- :mag: Gradle Cache Information (AFTER dependencies)"
      if [ -d ~/.gradle/caches ]; then
        echo "Gradle cache size: $(du -sh ~/.gradle/caches 2>/dev/null | cut -f1)"
        echo "Gradle cache entries: $(find ~/.gradle/caches -type f 2>/dev/null | wc -l)"
      fi

      echo "--- :hammer: Building project"
      echo "Running: ./gradlew clean build -x test"
      time ./gradlew clean build -x test --no-daemon

      echo "--- :package: Build Artifacts Created"
      echo "JAR files:"
      ls -lh build/libs/*.jar || echo "No JAR files found"
      echo ""
      echo "Compiled classes:"
      du -sh build/classes 2>/dev/null || echo "No compiled classes"
      echo ""
      echo "Total build directory size: $(du -sh build | cut -f1)"

      echo "--- :arrow_up: Uploading artifacts to Buildkite"
      echo "These artifacts will be available to ALL steps (local and hosted)"
      buildkite-agent artifact upload "build/libs/*.jar"
      echo "Uploaded: build/libs/*.jar"
    artifact_paths:
      - "build/libs/*.jar"
    timeout_in_minutes: 15

  - label: ":test_tube: Run Java Tests (Local) - Java {{matrix.java_version}}"
    key: "test-java"
    depends_on: "build"
    agents:
      queue: "default"  # Self-hosted/local agent
    matrix:
      setup:
        java_version:
          - "17"
          - "21"
    env:
      JAVA_VERSION: "{{matrix.java_version}}"
    command: |
      echo "--- :computer: Agent & Environment Information"
      echo "Matrix: Java ${JAVA_VERSION}"
      echo "Queue: ${BUILDKITE_AGENT_META_DATA_QUEUE:-default}"
      echo "Agent ID: ${BUILDKITE_AGENT_ID}"
      echo "Agent Name: ${BUILDKITE_AGENT_NAME}"
      echo "Hostname: $(hostname)"
      echo "Process ID: $$"
      echo "Job ID: ${BUILDKITE_JOB_ID}"
      echo "Build ID: ${BUILDKITE_BUILD_ID}"
      echo ""

      echo "--- :coffee: Setting up Java ${JAVA_VERSION}"
      # Install Java version if not already available
      if ! java -version 2>&1 | grep -q "openjdk version \"${JAVA_VERSION}"; then
        if [ "${JAVA_VERSION}" = "17" ]; then
          echo "Installing Java 17..."
          if [[ "$OSTYPE" == "darwin"* ]]; then
            brew install openjdk@17 || echo "Java 17 already installed"
            export JAVA_HOME=$(/usr/libexec/java_home -v 17)
          else
            sudo apt-get update && sudo apt-get install -y openjdk-17-jdk
            export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
          fi
        elif [ "${JAVA_VERSION}" = "21" ]; then
          echo "Java 21 already installed (default)"
          export JAVA_HOME=${JAVA_HOME:-/usr/lib/jvm/java-21-amazon-corretto}
        fi
      else
        echo "Java ${JAVA_VERSION} already available"
        export JAVA_HOME=$(/usr/libexec/java_home -v ${JAVA_VERSION} 2>/dev/null || echo "/usr/lib/jvm/java-${JAVA_VERSION}-openjdk-amd64")
      fi

      export PATH="${JAVA_HOME}/bin:${PATH}"
      echo "JAVA_HOME: ${JAVA_HOME}"
      java -version

      echo "--- :mag: Gradle Cache Check"
      echo "Cache reused from build step (same local agent)"
      if [ -d ~/.gradle/caches ]; then
        echo "Gradle cache size: $(du -sh ~/.gradle/caches 2>/dev/null | cut -f1)"
      fi

      echo "--- :test_tube: Running Java unit tests with Java ${JAVA_VERSION}"
      echo "Running: ./gradlew test"
      time ./gradlew test --no-daemon || EXIT_CODE=$?

      echo "--- :arrow_up: Uploading test results"
      buildkite-agent artifact upload "build/test-results/**/*.xml"
      buildkite-agent artifact upload "build/reports/tests/**/*"

      exit ${EXIT_CODE:-0}
    artifact_paths:
      - "build/test-results/**/*.xml"
      - "build/reports/tests/**/*"
    plugins:
      - test-collector#v1.10.2:
          files: "build/test-results/test/*.xml"
          format: "junit"
    soft_fail:
      - exit_status: "*"
    timeout_in_minutes: 20
    retry:
      automatic:
        - exit_status: "*"
          limit: 2

  - label: ":jest: Run JavaScript Tests (Hosted) - Node 18"
    key: "test-js-node18"
    depends_on: "build"
    parallelism: 4  # Split tests across 4 agents
    agents:
      queue: "bk-hosted"  # Hosted agent
    env:
      NODE_VERSION: "18"
      # Buildkite Test Engine configuration
      BUILDKITE_ORGANIZATION_SLUG: "zealouspy"
      BUILDKITE_TEST_ENGINE_SUITE_SLUG: "zealous-grade-web-app"
      BUILDKITE_TEST_ENGINE_TEST_RUNNER: "jest"
      BUILDKITE_TEST_ENGINE_RESULT_PATH: "test-results/bktec-result.json"
    plugins:
      - test-collector#v1.10.2:
          files: "test-results/jest/*.xml"
          format: "junit"
    command: |
      echo "--- :computer: Agent & Environment Information"
      echo "Matrix: Node ${NODE_VERSION}"
      echo "Parallelism: Job $${BUILDKITE_PARALLEL_JOB} of $${BUILDKITE_PARALLEL_JOB_COUNT}"
      echo "Agent ID: ${BUILDKITE_AGENT_ID}"
      echo "Agent Name: ${BUILDKITE_AGENT_NAME}"
      echo "Hostname: $(hostname)"
      echo "Container ID: $(cat /proc/self/cgroup | head -n 1 | cut -d '/' -f3 | cut -c1-12 || echo 'N/A')"
      echo "IP Address: $(hostname -I | awk '{print $1}' || echo 'N/A')"
      echo "Job ID: ${BUILDKITE_JOB_ID}"
      echo "Build ID: ${BUILDKITE_BUILD_ID}"
      echo ""
      echo "--- :information_source: Parallelism + Multi-Version Setup"
      echo "This build tests across multiple Node versions with parallelism:"
      echo "• Node versions: 18 and 20 (separate steps)"
      echo "• Parallelism: 4 agents per Node version"
      echo "• Total agents: 2 versions × 4 parallelism = 8 agents running simultaneously"
      echo "• This specific agent: Node ${NODE_VERSION}, parallel job $${BUILDKITE_PARALLEL_JOB}/$${BUILDKITE_PARALLEL_JOB_COUNT}"
      echo ""

      echo "--- :wrench: Installing Node.js ${NODE_VERSION}.x"
      echo "Testing with Node.js ${NODE_VERSION}"

      # Install the specific Node.js version
      curl -fsSL https://deb.nodesource.com/setup_${NODE_VERSION}.x | sudo bash - >/dev/null 2>&1
      sudo apt-get install -y nodejs >/dev/null 2>&1

      echo "Node.js $(node --version) | npm $(npm --version)"

      # Verify we got the right version
      INSTALLED_VERSION=$(node --version | cut -d'v' -f2 | cut -d'.' -f1)
      echo "Installed Node.js major version: ${INSTALLED_VERSION}"
      if [ "${INSTALLED_VERSION}" != "${NODE_VERSION}" ]; then
        echo "⚠️  Warning: Expected Node ${NODE_VERSION}, got Node ${INSTALLED_VERSION}"
      else
        echo "✅ Correct Node.js version installed"
      fi

      echo "--- :nodejs: Installing dependencies"
      time npm install

      echo "--- :key: Fetching Test Engine API token from cluster secrets"
      if buildkite-agent secret get myBktecToken 2>/dev/null; then
        export BUILDKITE_TEST_ENGINE_API_ACCESS_TOKEN=$(buildkite-agent secret get myBktecToken)
        echo "✅ Secret fetched successfully"
      else
        echo "⚠️  Failed to fetch secret from cluster - secret get command not available or failed"
        echo "Continuing without Test Engine (tests will run without bktec)"
      fi

      echo "--- :package: Installing Buildkite Test Engine Client (bktec)"
      # Get latest version and download bktec for Linux AMD64
      BKTEC_VERSION=$(curl -s https://api.github.com/repos/buildkite/test-engine-client/releases/latest | grep '"tag_name"' | cut -d'"' -f4)
      echo "Latest bktec version: $${BKTEC_VERSION}"
      # Strip 'v' prefix from version tag for filename
      BKTEC_VERSION_NUMBER=$(echo "$${BKTEC_VERSION}" | sed 's/^v//')
      curl -Lf -o bktec "https://github.com/buildkite/test-engine-client/releases/download/$${BKTEC_VERSION}/bktec_$${BKTEC_VERSION_NUMBER}_linux_amd64"
      chmod +x bktec
      echo "bktec version: $(./bktec --version)"

      echo "--- :mag: Buildkite Test Engine Configuration Check"
      echo "Environment variables:"
      if [ -z "${BUILDKITE_TEST_ENGINE_API_ACCESS_TOKEN}" ]; then
        echo "  ❌ BUILDKITE_TEST_ENGINE_API_ACCESS_TOKEN: NOT SET"
        echo "  ⚠️  Token must be set in Buildkite Pipeline Settings → Environment Variables"
        echo "  ⚠️  See BUILDKITE_TEST_ENGINE_SETUP.md for instructions"
      else
        echo "  ✅ BUILDKITE_TEST_ENGINE_API_ACCESS_TOKEN: SET (hidden)"
      fi
      echo "  Suite Slug: ${BUILDKITE_TEST_ENGINE_SUITE_SLUG}"
      echo "  Test Runner: ${BUILDKITE_TEST_ENGINE_TEST_RUNNER}"
      echo "  Result Path: ${BUILDKITE_TEST_ENGINE_RESULT_PATH}"
      echo ""
      echo "Test Suites must be created in Buildkite Test Engine:"
      echo "  → https://buildkite.com/organizations/~/test-engine"
      echo "  Suite slug must match exactly: ${BUILDKITE_TEST_ENGINE_SUITE_SLUG}"
      echo ""

      echo "--- :jest: Running Jest tests with Node ${NODE_VERSION} via bktec"
      # Check if Test Engine token is configured
      if [ -z "${BUILDKITE_TEST_ENGINE_API_ACCESS_TOKEN}" ]; then
        echo "⚠️  BUILDKITE_TEST_ENGINE_API_ACCESS_TOKEN not set - running tests without bktec"
        echo "Running ALL tests on this agent (no intelligent splitting)"
        npm run test:ci || EXIT_CODE=$?
      else
        echo "✅ Test Engine token configured - running with bktec"
        echo "Suite: ${BUILDKITE_TEST_ENGINE_SUITE_SLUG:-javascript-tests}"
        echo "Parallel job: $${BUILDKITE_PARALLEL_JOB}/$${BUILDKITE_PARALLEL_JOB_COUNT}"
        echo ""
        echo "bktec will intelligently split tests across the 4 parallel agents based on:"
        echo "• Historical test timing data"
        echo "• Test file sizes"
        echo "• Previous run durations"
        echo "• Balanced distribution to minimize total run time"
        echo ""
        echo "Expected: ~25-30 tests per agent (out of ~100 total)"
        echo ""

        # Run Jest through bktec for test analytics and splitting
        ./bktec || EXIT_CODE=$?

        echo ""
        echo "--- :chart_with_upwards_trend: Test Execution Summary"
        echo "Parallel job $${BUILDKITE_PARALLEL_JOB}/$${BUILDKITE_PARALLEL_JOB_COUNT} completed"
        echo "Results will be aggregated across all 4 parallel agents"
        echo "View complete analytics in Buildkite Test Engine for suite: ${BUILDKITE_TEST_ENGINE_SUITE_SLUG}"
      fi

      echo "--- :arrow_up: Uploading test results"
      buildkite-agent artifact upload "test-results/**/*.xml"
      buildkite-agent artifact upload "coverage/**/*"

      exit ${EXIT_CODE:-0}
    artifact_paths:
      - "test-results/**/*.xml"
      - "coverage/**/*"
    soft_fail:
      - exit_status: "*"
    timeout_in_minutes: 10
    retry:
      automatic:
        - exit_status: "*"
          limit: 2

