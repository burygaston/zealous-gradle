env:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.parallel=true"

steps:
  - label: ":gradle: Build Project"
    key: "build"
    command: |
      echo "--- :package: Installing dependencies"
      ./gradlew dependencies --no-daemon

      echo "--- :hammer: Building project"
      ./gradlew clean build -x test --no-daemon

      echo "--- :arrow_up: Uploading JAR artifact"
      buildkite-agent artifact upload "build/libs/*.jar"
    artifact_paths:
      - "build/libs/*.jar"
    timeout_in_minutes: 15

  - label: ":test_tube: Run Tests"
    key: "test"
    depends_on: "build"
    command: |
      echo "--- :test_tube: Running unit tests"
      ./gradlew test --no-daemon

      echo "--- :arrow_up: Uploading test results"
      buildkite-agent artifact upload "build/test-results/**/*.xml"
      buildkite-agent artifact upload "build/reports/tests/**/*"
    artifact_paths:
      - "build/test-results/**/*.xml"
      - "build/reports/tests/**/*"
    timeout_in_minutes: 20
    retry:
      automatic:
        - exit_status: "*"
          limit: 2

  - wait

  - label: ":memo: Build Summary"
    key: "summary"
    command: |
      echo "--- :clipboard: Generating build summary annotation"

      # Create annotation from markdown file
      cat buildkite-annotation.md | buildkite-agent annotate --style "success" --context "build-report"

      # Add a simple success message
      echo "Build completed successfully!" | buildkite-agent annotate --style "success" --context "status"

      # Add info annotation with build artifacts
      cat <<EOF | buildkite-agent annotate --style "info" --context "artifacts"
      ## 📦 Build Artifacts

      The following artifacts were generated:
      - \`task-manager-1.0.0.jar\` - Application JAR file
      - Test results (XML format)
      - Test reports (HTML format)

      Download from the **Artifacts** tab above.
      EOF

      # Add warning annotation for next steps (optional)
      cat <<EOF | buildkite-agent annotate --style "warning" --context "next-steps"
      ## ⚠️ Next Steps Required

      Please review the test results before deploying to production.

      - [ ] Review test coverage
      - [ ] Check for any warnings
      - [ ] Verify all critical tests passed
      EOF

      echo "--- :tada: All annotations created successfully!"
    timeout_in_minutes: 2
