env:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.parallel=true"
  BUILDKITE_ANALYTICS_TOKEN: "VXzdR2LfZPQ93FXXetcCcsJW"

steps:
  - label: ":mag: System Diagnostics"
    key: "diagnostics"
    agents:
      queue: "bk-hosted"
    command: |
      echo "--- :computer: OS Information"
      uname -a
      echo ""
      cat /etc/os-release || lsb_release -a
      echo "Architecture: $(uname -m)"

      echo "--- :gear: CPU Configuration"
      lscpu || cat /proc/cpuinfo | grep -E "processor|model name|cpu cores" | head -20

      echo "--- :floppy_disk: Memory Information"
      free -m
      echo ""
      cat /proc/meminfo | head -10

      echo "--- :file_folder: Disk and Mounts"
      df -h
      echo ""
      lsblk || echo "lsblk not available"

      echo "--- :network: Network Interfaces"
      ip addr 2>/dev/null || ifconfig 2>/dev/null || echo "Network tools not available"

      echo "--- :package: Installed Packages (sampling)"
      if command -v dpkg &> /dev/null; then
        echo "Debian/Ubuntu system detected"
        dpkg -l | grep -E "java|node|git|docker|curl" || echo "No matching packages"
      elif command -v rpm &> /dev/null; then
        echo "Red Hat/CentOS system detected"
        rpm -qa | grep -E "java|node|git|docker|curl" || echo "No matching packages"
      fi

      echo "--- :wrench: Checking for Java installations"
      find /usr/lib/jvm -type d 2>/dev/null || echo "/usr/lib/jvm not found"
      find /usr -name "java" -type f 2>/dev/null | head -10 || echo "No java executables found"

      echo "--- :wrench: Checking for Node.js"
      which node || echo "node not in PATH"
      which npm || echo "npm not in PATH"

      echo "--- :globe_with_meridians: Environment Variables"
      env | grep -E "JAVA|PATH|HOME" | sort
    timeout_in_minutes: 5

  - label: ":gradle: Build Project"
    key: "build"
    agents:
      queue: "bk-hosted"
    command: |
      echo "--- :wrench: Installing Java 21"
      # Install Java 21 (Amazon Corretto)
      curl -fsSL https://apt.corretto.aws/corretto.key | sudo gpg --dearmor -o /usr/share/keyrings/corretto-keyring.gpg
      echo "deb [signed-by=/usr/share/keyrings/corretto-keyring.gpg] https://apt.corretto.aws stable main" | sudo tee /etc/apt/sources.list.d/corretto.list
      sudo apt-get update
      sudo apt-get install -y java-21-amazon-corretto-jdk

      echo "--- :mag: Setting up Java environment"
      export JAVA_HOME=/usr/lib/jvm/java-21-amazon-corretto
      export PATH="$JAVA_HOME/bin:$PATH"
      echo "JAVA_HOME set to: $JAVA_HOME"
      java -version

      echo "--- :package: Installing dependencies"
      ./gradlew dependencies --no-daemon

      echo "--- :hammer: Building project"
      ./gradlew clean build -x test --no-daemon

      echo "--- :arrow_up: Uploading JAR artifact"
      buildkite-agent artifact upload "build/libs/*.jar"
    artifact_paths:
      - "build/libs/*.jar"
    timeout_in_minutes: 15

  - label: ":test_tube: Run Java Tests"
    key: "test-java"
    depends_on: "build"
    agents:
      queue: "bk-hosted"
    command: |
      echo "--- :wrench: Installing Java 21"
      curl -fsSL https://apt.corretto.aws/corretto.key | sudo gpg --dearmor -o /usr/share/keyrings/corretto-keyring.gpg
      echo "deb [signed-by=/usr/share/keyrings/corretto-keyring.gpg] https://apt.corretto.aws stable main" | sudo tee /etc/apt/sources.list.d/corretto.list
      sudo apt-get update
      sudo apt-get install -y java-21-amazon-corretto-jdk

      export JAVA_HOME=/usr/lib/jvm/java-21-amazon-corretto
      export PATH="$JAVA_HOME/bin:$PATH"

      echo "--- :test_tube: Running Java unit tests"
      ./gradlew test --no-daemon || EXIT_CODE=$?

      echo "--- :arrow_up: Uploading test results"
      buildkite-agent artifact upload "build/test-results/**/*.xml"
      buildkite-agent artifact upload "build/reports/tests/**/*"

      exit ${EXIT_CODE:-0}
    artifact_paths:
      - "build/test-results/**/*.xml"
      - "build/reports/tests/**/*"
    plugins:
      - test-collector#v1.10.2:
          files: "build/test-results/test/*.xml"
          format: "junit"
    soft_fail:
      - exit_status: "*"
    timeout_in_minutes: 20
    retry:
      automatic:
        - exit_status: "*"
          limit: 2

  - label: ":jest: Run JavaScript Tests"
    key: "test-js"
    depends_on: "build"
    agents:
      queue: "bk-hosted"
    command: |
      echo "--- :wrench: Installing Node.js 20.x"
      curl -fsSL https://deb.nodesource.com/setup_20.x | sudo bash -
      sudo apt-get install -y nodejs

      echo "--- :nodejs: Installing Node.js dependencies"
      npm install

      echo "--- :jest: Running Jest tests"
      npm run test:ci || EXIT_CODE=$?

      echo "--- :arrow_up: Uploading test results and coverage"
      buildkite-agent artifact upload "test-results/**/*.xml"
      buildkite-agent artifact upload "coverage/**/*"

      exit ${EXIT_CODE:-0}
    artifact_paths:
      - "test-results/**/*.xml"
      - "coverage/**/*"
    plugins:
      - test-collector#v1.10.2:
          files: "test-results/jest/*.xml"
          format: "junit"
    soft_fail:
      - exit_status: "*"
    timeout_in_minutes: 10
    retry:
      automatic:
        - exit_status: "*"
          limit: 2

  - wait

  - label: ":bar_chart: Test Results Summary"
    key: "test-summary"
    agents:
      queue: "bk-hosted"
    command: |
      echo "--- :inbox_tray: Downloading test artifacts"
      buildkite-agent artifact download "build/test-results/**/*.xml" . || true
      buildkite-agent artifact download "test-results/**/*.xml" . || true

      echo "--- :chart_with_upwards_trend: Parsing test results"

      # Parse Java test results
      JAVA_TOTAL=$(find build/test-results -name "*.xml" -exec grep -h "tests=" {} \; 2>/dev/null | sed 's/.*tests="\([0-9]*\)".*/\1/' | awk '{s+=$1} END {print s+0}')
      JAVA_FAILURES=$(find build/test-results -name "*.xml" -exec grep -h "failures=" {} \; 2>/dev/null | sed 's/.*failures="\([0-9]*\)".*/\1/' | awk '{s+=$1} END {print s+0}')
      JAVA_ERRORS=$(find build/test-results -name "*.xml" -exec grep -h "errors=" {} \; 2>/dev/null | sed 's/.*errors="\([0-9]*\)".*/\1/' | awk '{s+=$1} END {print s+0}')
      JAVA_SKIPPED=$(find build/test-results -name "*.xml" -exec grep -h "skipped=" {} \; 2>/dev/null | sed 's/.*skipped="\([0-9]*\)".*/\1/' | awk '{s+=$1} END {print s+0}')
      JAVA_PASSED=$((JAVA_TOTAL - JAVA_FAILURES - JAVA_ERRORS - JAVA_SKIPPED))

      # Parse JavaScript test results
      JS_TOTAL=$(find test-results -name "*.xml" -exec grep -h "tests=" {} \; 2>/dev/null | sed 's/.*tests="\([0-9]*\)".*/\1/' | awk '{s+=$1} END {print s+0}')
      JS_FAILURES=$(find test-results -name "*.xml" -exec grep -h "failures=" {} \; 2>/dev/null | sed 's/.*failures="\([0-9]*\)".*/\1/' | awk '{s+=$1} END {print s+0}')
      JS_ERRORS=$(find test-results -name "*.xml" -exec grep -h "errors=" {} \; 2>/dev/null | sed 's/.*errors="\([0-9]*\)".*/\1/' | awk '{s+=$1} END {print s+0}')
      JS_SKIPPED=$(find test-results -name "*.xml" -exec grep -h "skipped=" {} \; 2>/dev/null | sed 's/.*skipped="\([0-9]*\)".*/\1/' | awk '{s+=$1} END {print s+0}')
      JS_PASSED=$((JS_TOTAL - JS_FAILURES - JS_ERRORS - JS_SKIPPED))

      # Calculate totals
      TOTAL_TESTS=$((JAVA_TOTAL + JS_TOTAL))
      TOTAL_PASSED=$((JAVA_PASSED + JS_PASSED))
      TOTAL_FAILED=$((JAVA_FAILURES + JAVA_ERRORS + JS_FAILURES + JS_ERRORS))
      TOTAL_SKIPPED=$((JAVA_SKIPPED + JS_SKIPPED))

      # Determine annotation style
      if [ $TOTAL_FAILED -gt 0 ]; then
        STYLE="error"
        STATUS_EMOJI="❌"
        STATUS_TEXT="Tests Failed"
      else
        STYLE="success"
        STATUS_EMOJI="✅"
        STATUS_TEXT="All Tests Passed"
      fi

      echo "--- :memo: Creating test results annotation"
      cat <<EOF | buildkite-agent annotate --style "$STYLE" --context "test-results"
      ## $STATUS_EMOJI $STATUS_TEXT

      ### 📊 Overall Summary
      - **Total Tests**: $TOTAL_TESTS
      - **Passed**: $TOTAL_PASSED ✅
      - **Failed**: $TOTAL_FAILED ❌
      - **Skipped**: $TOTAL_SKIPPED ⏭️

      ---

      ### ☕ Java Tests
      - **Total**: $JAVA_TOTAL
      - **Passed**: $JAVA_PASSED ✅
      - **Failed**: $((JAVA_FAILURES + JAVA_ERRORS)) ❌
      - **Skipped**: $JAVA_SKIPPED ⏭️

      ### 🟨 JavaScript Tests
      - **Total**: $JS_TOTAL
      - **Passed**: $JS_PASSED ✅
      - **Failed**: $((JS_FAILURES + JS_ERRORS)) ❌
      - **Skipped**: $JS_SKIPPED ⏭️

      ---

      📈 View detailed test analytics in [Buildkite Test Suite](https://buildkite.com/organizations/~/analytics)
      EOF

      echo "--- :white_check_mark: Test summary created"
    timeout_in_minutes: 5

  - label: ":docker: Build & Push Docker Image"
    key: "docker"
    agents:
      queue: "bk-hosted"
    command: |
      echo "--- :docker: Building Docker image"

      # Set image tag with build number and commit
      IMAGE_TAG="${BUILDKITE_BUILD_NUMBER}-${BUILDKITE_COMMIT:0:7}"
      DOCKER_IMAGE="${DOCKERHUB_USERNAME:-taskmanager}/task-manager"

      # Build the Docker image
      docker build -t ${DOCKER_IMAGE}:${IMAGE_TAG} -t ${DOCKER_IMAGE}:latest .

      echo "--- :arrow_up: Pushing to DockerHub"

      # Login to DockerHub (requires DOCKERHUB_USERNAME and DOCKERHUB_TOKEN environment variables)
      echo "${DOCKERHUB_TOKEN}" | docker login -u "${DOCKERHUB_USERNAME}" --password-stdin

      # Push both tags
      docker push ${DOCKER_IMAGE}:${IMAGE_TAG}
      docker push ${DOCKER_IMAGE}:latest

      echo "--- :white_check_mark: Docker image pushed successfully"
      echo "Image: ${DOCKER_IMAGE}:${IMAGE_TAG}"
      echo "Latest: ${DOCKER_IMAGE}:latest"

      # Create annotation with Docker image info
      cat <<EOF | buildkite-agent annotate --style "info" --context "docker-info"
      ## 🐳 Docker Image Published

      **Image:** \`${DOCKER_IMAGE}:${IMAGE_TAG}\`
      **Latest:** \`${DOCKER_IMAGE}:latest\`

      ### Pull the image:
      \`\`\`bash
      docker pull ${DOCKER_IMAGE}:${IMAGE_TAG}
      \`\`\`

      ### Run the container:
      \`\`\`bash
      docker run -p 8080:8080 ${DOCKER_IMAGE}:${IMAGE_TAG}
      \`\`\`
      EOF
    timeout_in_minutes: 15

  - label: ":memo: Build Summary"
    key: "summary"
    agents:
      queue: "bk-hosted"
    command: |
      echo "--- :clipboard: Generating build summary annotation"

      # Create annotation from markdown file
      cat buildkite-annotation.md | buildkite-agent annotate --style "success" --context "build-report"

      # Add a simple success message
      echo "Build completed successfully!" | buildkite-agent annotate --style "success" --context "status"

      # Add info annotation with build artifacts
      cat <<EOF | buildkite-agent annotate --style "info" --context "artifacts"
      ## 📦 Build Artifacts

      The following artifacts were generated:
      - \`task-manager-1.0.0.jar\` - Application JAR file
      - Java test results (120 tests including 10 flaky - XML and HTML format)
      - JavaScript test results (110 tests including 10 flaky - JUnit XML and coverage reports)
      - Docker image (see Docker Image Published annotation)

      Download from the **Artifacts** tab above.
      EOF

      # Add warning annotation for next steps (optional)
      cat <<EOF | buildkite-agent annotate --style "warning" --context "next-steps"
      ## ⚠️ Next Steps Required

      Please review the test results before deploying to production.

      - [ ] Review test coverage
      - [ ] Check for any warnings
      - [ ] Verify all critical tests passed
      - [ ] Test Docker image locally
      EOF

      echo "--- :tada: All annotations created successfully!"
    timeout_in_minutes: 2
