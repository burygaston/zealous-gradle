  - wait

  - label: ":bar_chart: Test Results Summary"
    key: "test-summary"
    agents:
      queue: "bk-hosted"
    command: |
      echo "--- :inbox_tray: Downloading test artifacts"
      buildkite-agent artifact download "build/test-results/**/*.xml" . || true
      buildkite-agent artifact download "test-results/**/*.xml" . || true

      echo "--- :chart_with_upwards_trend: Parsing test results"

      # Parse Java test results
      JAVA_TOTAL=$(find build/test-results -name "*.xml" -exec grep -h "tests=" {} \; 2>/dev/null | sed 's/.*tests="\([0-9]*\)".*/\1/' | awk '{s+=$1} END {print s+0}')
      JAVA_FAILURES=$(find build/test-results -name "*.xml" -exec grep -h "failures=" {} \; 2>/dev/null | sed 's/.*failures="\([0-9]*\)".*/\1/' | awk '{s+=$1} END {print s+0}')
      JAVA_ERRORS=$(find build/test-results -name "*.xml" -exec grep -h "errors=" {} \; 2>/dev/null | sed 's/.*errors="\([0-9]*\)".*/\1/' | awk '{s+=$1} END {print s+0}')
      JAVA_SKIPPED=$(find build/test-results -name "*.xml" -exec grep -h "skipped=" {} \; 2>/dev/null | sed 's/.*skipped="\([0-9]*\)".*/\1/' | awk '{s+=$1} END {print s+0}')
      JAVA_PASSED=$((JAVA_TOTAL - JAVA_FAILURES - JAVA_ERRORS - JAVA_SKIPPED))

      # Parse JavaScript test results
      JS_TOTAL=$(find test-results -name "*.xml" -exec grep -h "tests=" {} \; 2>/dev/null | sed 's/.*tests="\([0-9]*\)".*/\1/' | awk '{s+=$1} END {print s+0}')
      JS_FAILURES=$(find test-results -name "*.xml" -exec grep -h "failures=" {} \; 2>/dev/null | sed 's/.*failures="\([0-9]*\)".*/\1/' | awk '{s+=$1} END {print s+0}')
      JS_ERRORS=$(find test-results -name "*.xml" -exec grep -h "errors=" {} \; 2>/dev/null | sed 's/.*errors="\([0-9]*\)".*/\1/' | awk '{s+=$1} END {print s+0}')
      JS_SKIPPED=$(find test-results -name "*.xml" -exec grep -h "skipped=" {} \; 2>/dev/null | sed 's/.*skipped="\([0-9]*\)".*/\1/' | awk '{s+=$1} END {print s+0}')
      JS_PASSED=$((JS_TOTAL - JS_FAILURES - JS_ERRORS - JS_SKIPPED))

      # Calculate totals
      TOTAL_TESTS=$((JAVA_TOTAL + JS_TOTAL))
      TOTAL_PASSED=$((JAVA_PASSED + JS_PASSED))
      TOTAL_FAILED=$((JAVA_FAILURES + JAVA_ERRORS + JS_FAILURES + JS_ERRORS))
      TOTAL_SKIPPED=$((JAVA_SKIPPED + JS_SKIPPED))

      # Determine annotation style
      if [ $TOTAL_FAILED -gt 0 ]; then
        STYLE="error"
        STATUS_EMOJI="❌"
        STATUS_TEXT="Tests Failed"
      else
        STYLE="success"
        STATUS_EMOJI="✅"
        STATUS_TEXT="All Tests Passed"
      fi

      echo "--- :memo: Creating test results annotation"
      cat <<EOF | buildkite-agent annotate --style "$STYLE" --context "test-results"
      ## $STATUS_EMOJI $STATUS_TEXT

      ### 📊 Overall Summary
      - **Total Tests**: $TOTAL_TESTS
      - **Passed**: $TOTAL_PASSED ✅
      - **Failed**: $TOTAL_FAILED ❌
      - **Skipped**: $TOTAL_SKIPPED ⏭️

      ---

      ### ☕ Java Tests
      - **Total**: $JAVA_TOTAL
      - **Passed**: $JAVA_PASSED ✅
      - **Failed**: $((JAVA_FAILURES + JAVA_ERRORS)) ❌
      - **Skipped**: $JAVA_SKIPPED ⏭️

      ### 🟨 JavaScript Tests
      - **Total**: $JS_TOTAL
      - **Passed**: $JS_PASSED ✅
      - **Failed**: $((JS_FAILURES + JS_ERRORS)) ❌
      - **Skipped**: $JS_SKIPPED ⏭️

      ---

      📈 View detailed test analytics in [Buildkite Test Suite](https://buildkite.com/organizations/~/analytics)
      EOF

      echo "--- :white_check_mark: Test summary created"
    timeout_in_minutes: 5

  - label: ":docker: Build & Push Docker Image (Hosted)"
    key: "docker"
    agents:
      queue: "bk-hosted"  # Hosted agent with Docker
    command: |
      echo "--- :computer: Agent Information"
      echo "Queue: bk-hosted (Buildkite Hosted Agent)"
      echo "Agent: ${BUILDKITE_AGENT_NAME}"
      echo "Hostname: $(hostname)"

      echo "--- :inbox_tray: Downloading JAR artifact from local build"
      echo "Artifacts built on LOCAL agent, downloaded to HOSTED agent"
      echo "Artifact storage: Buildkite's cloud storage"
      ls -lh build/libs/ 2>/dev/null && echo "WARNING: Unexpected existing files" || echo "No existing files (expected)"

      echo "Downloading..."
      buildkite-agent artifact download "build/libs/*.jar" .

      echo "Downloaded artifacts:"
      ls -lh build/libs/*.jar
      echo "File size: $(du -sh build/libs/*.jar | cut -f1)"
      echo "NOTE: This JAR was built on a LOCAL agent, transferred via Buildkite"

      echo "--- :docker: Docker Layer Cache Status"
      echo "Container cache enabled in Buildkite UI settings"
      echo "Docker will attempt to reuse layers from previous builds"
      echo "Base images and unchanged RUN commands will be cached"

      echo "--- :docker: Building Docker image"
      # Set image tag with build number and commit
      IMAGE_TAG="${BUILDKITE_BUILD_NUMBER}-${BUILDKITE_COMMIT:0:7}"
      DOCKER_IMAGE="${DOCKERHUB_USERNAME:-taskmanager}/task-manager"

      # Build the Docker image
      echo "Running: docker build"
      echo "Watch for 'CACHED' indicators in output (shows layer cache hits)"
      time docker build -t ${DOCKER_IMAGE}:${IMAGE_TAG} -t ${DOCKER_IMAGE}:latest .

      echo "--- :arrow_up: Pushing to DockerHub"

      # Login to DockerHub (requires DOCKERHUB_USERNAME and DOCKERHUB_TOKEN environment variables)
      echo "${DOCKERHUB_TOKEN}" | docker login -u "${DOCKERHUB_USERNAME}" --password-stdin

      # Push both tags
      docker push ${DOCKER_IMAGE}:${IMAGE_TAG}
      docker push ${DOCKER_IMAGE}:latest

      echo "--- :white_check_mark: Docker image pushed successfully"
      echo "Image: ${DOCKER_IMAGE}:${IMAGE_TAG}"
      echo "Latest: ${DOCKER_IMAGE}:latest"

      # Create annotation with Docker image info
      cat <<EOF | buildkite-agent annotate --style "info" --context "docker-info"
      ## 🐳 Docker Image Published

      **Image:** \`${DOCKER_IMAGE}:${IMAGE_TAG}\`
      **Latest:** \`${DOCKER_IMAGE}:latest\`

      ### Pull the image:
      \`\`\`bash
      docker pull ${DOCKER_IMAGE}:${IMAGE_TAG}
      \`\`\`

      ### Run the container:
      \`\`\`bash
      docker run -p 8080:8080 ${DOCKER_IMAGE}:${IMAGE_TAG}
      \`\`\`
      EOF
    timeout_in_minutes: 15

  - label: ":memo: Build Summary"
    key: "summary"
    agents:
      queue: "bk-hosted"
    command: |
      echo "--- :clipboard: Generating build summary annotation"

      # Create annotation from markdown file
      cat buildkite-annotation.md | buildkite-agent annotate --style "success" --context "build-report"

      # Add a simple success message
      echo "Build completed successfully!" | buildkite-agent annotate --style "success" --context "status"

      # Add info annotation with build artifacts
      cat <<EOF | buildkite-agent annotate --style "info" --context "artifacts"
      ## 📦 Build Artifacts

      The following artifacts were generated:
      - \`task-manager-1.0.0.jar\` - Application JAR file
      - Java test results (120 tests including 10 flaky - XML and HTML format)
      - JavaScript test results (110 tests including 10 flaky - JUnit XML and coverage reports)
      - Docker image (see Docker Image Published annotation)

      Download from the **Artifacts** tab above.
      EOF

      # Add warning annotation for next steps (optional)
      cat <<EOF | buildkite-agent annotate --style "warning" --context "next-steps"
      ## ⚠️ Next Steps Required

      Please review the test results before deploying to production.

      - [ ] Review test coverage
      - [ ] Check for any warnings
      - [ ] Verify all critical tests passed
      - [ ] Test Docker image locally
      EOF

      echo "--- :tada: All annotations created successfully!"
    timeout_in_minutes: 2
