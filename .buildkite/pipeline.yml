env:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Dorg.gradle.caching=true"

steps:
  - label: ":gradle: Setup & Cache Dependencies"
    key: "setup"
    command: |
      echo "--- :package: Downloading dependencies"
      ./gradlew dependencies --no-daemon
      echo "--- :white_check_mark: Setup complete"
    plugins:
      - docker#v5.8.0:
          image: gradle:8.5-jdk17
          volumes:
            - gradle-cache:/home/gradle/.gradle
          workdir: /workspace
    timeout_in_minutes: 10

  - label: ":hammer: Build Application"
    key: "build"
    depends_on: "setup"
    command: |
      echo "--- :java: Compiling Java sources"
      ./gradlew clean build -x test --no-daemon
      echo "--- :package: Creating JAR artifact"
      ls -lh build/libs/
      echo "--- :arrow_up: Uploading artifacts"
      buildkite-agent artifact upload "build/libs/*.jar"
    plugins:
      - docker#v5.8.0:
          image: gradle:8.5-jdk17
          volumes:
            - gradle-cache:/home/gradle/.gradle
          workdir: /workspace
    artifact_paths:
      - "build/libs/*.jar"
    timeout_in_minutes: 15

  - label: ":test_tube: Unit Tests (Shard {{matrix}})"
    key: "unit-tests"
    depends_on: "setup"
    command: |
      echo "--- :test_tube: Running unit tests - Shard {{matrix}} of 3"
      ./gradlew test --no-daemon \
        -Dorg.gradle.test.ignoreFailures=true \
        --tests '*Test'
      echo "--- :chart_with_upwards_trend: Uploading test results"
      buildkite-agent artifact upload "build/test-results/**/*.xml"
      buildkite-agent artifact upload "build/reports/tests/**/*"
    plugins:
      - docker#v5.8.0:
          image: gradle:8.5-jdk17
          volumes:
            - gradle-cache:/home/gradle/.gradle
          workdir: /workspace
      - test-collector#v1.10.0:
          files: "build/test-results/**/*.xml"
          format: "junit"
          api-token-env-name: "BUILDKITE_TEST_ENGINE_API_KEY"
    matrix:
      - "1"
      - "2"
      - "3"
    artifact_paths:
      - "build/test-results/**/*.xml"
      - "build/reports/tests/**/*"
    timeout_in_minutes: 20
    retry:
      automatic:
        - exit_status: "*"
          limit: 2

  - label: ":docker: Integration Tests"
    key: "integration-tests"
    depends_on:
      - "build"
      - "unit-tests"
    command: |
      echo "--- :docker: Starting MySQL container"
      docker-compose up -d mysql
      echo "--- :hourglass: Waiting for MySQL to be ready"
      timeout 60 bash -c 'until docker-compose exec -T mysql mysqladmin ping -h localhost --silent; do sleep 2; done'
      echo "--- :seedling: Initializing database"
      docker-compose exec -T mysql mysql -u root -prootpass123 taskmanager < src/main/resources/schema.sql || true
      echo "--- :test_tube: Running integration tests"
      ./gradlew test --no-daemon -Dspring.profiles.active=test
      echo "--- :broom: Cleaning up containers"
      docker-compose down -v
    plugins:
      - docker-compose#v4.16.0:
          run: app
          config: docker-compose.yml
          pull: mysql
          leave-volumes: false
      - artifacts#v1.9.0:
          download:
            - "build/libs/*.jar"
    artifact_paths:
      - "build/test-results/**/*.xml"
      - "build/reports/tests/**/*"
    timeout_in_minutes: 25

  - label: ":flaky_test_tube: Flaky Test Detection (Run {{matrix}})"
    key: "flaky-tests"
    depends_on: "unit-tests"
    command: |
      echo "--- :test_tube: Running flaky tests - Attempt {{matrix}}"
      ./gradlew test --no-daemon --tests '*WorkItemServiceTest.flakyTestForBuildkiteDetection' || true
      echo "--- Test run {{matrix}} complete"
    plugins:
      - docker#v5.8.0:
          image: gradle:8.5-jdk17
          volumes:
            - gradle-cache:/home/gradle/.gradle
          workdir: /workspace
      - test-collector#v1.10.0:
          files: "build/test-results/**/*.xml"
          format: "junit"
          api-token-env-name: "BUILDKITE_TEST_ENGINE_API_KEY"
    matrix:
      - "1"
      - "2"
      - "3"
    soft_fail: true
    timeout_in_minutes: 10

  - wait

  - label: ":checkered_flag: Code Quality - Checkstyle"
    key: "checkstyle"
    command: |
      echo "--- :mag: Running Checkstyle analysis"
      ./gradlew checkstyleMain checkstyleTest --no-daemon || true
      echo "--- :arrow_up: Uploading Checkstyle reports"
      buildkite-agent artifact upload "build/reports/checkstyle/**/*"
    plugins:
      - docker#v5.8.0:
          image: gradle:8.5-jdk17
          volumes:
            - gradle-cache:/home/gradle/.gradle
          workdir: /workspace
    artifact_paths:
      - "build/reports/checkstyle/**/*"
    soft_fail: true
    timeout_in_minutes: 10

  - label: ":mag: Code Quality - PMD"
    key: "pmd"
    command: |
      echo "--- :mag: Running PMD analysis"
      ./gradlew pmdMain pmdTest --no-daemon || true
      echo "--- :arrow_up: Uploading PMD reports"
      buildkite-agent artifact upload "build/reports/pmd/**/*"
    plugins:
      - docker#v5.8.0:
          image: gradle:8.5-jdk17
          volumes:
            - gradle-cache:/home/gradle/.gradle
          workdir: /workspace
    artifact_paths:
      - "build/reports/pmd/**/*"
    soft_fail: true
    timeout_in_minutes: 10

  - label: ":bug: Code Quality - SpotBugs"
    key: "spotbugs"
    command: |
      echo "--- :mag: Running SpotBugs analysis"
      ./gradlew spotbugsMain spotbugsTest --no-daemon || true
      echo "--- :arrow_up: Uploading SpotBugs reports"
      buildkite-agent artifact upload "build/reports/spotbugs/**/*"
    plugins:
      - docker#v5.8.0:
          image: gradle:8.5-jdk17
          volumes:
            - gradle-cache:/home/gradle/.gradle
          workdir: /workspace
    artifact_paths:
      - "build/reports/spotbugs/**/*"
    soft_fail: true
    timeout_in_minutes: 10

  - wait

  - label: ":package: Package Artifacts"
    key: "package"
    depends_on:
      - "build"
      - "unit-tests"
      - "integration-tests"
    command: |
      echo "--- :package: Preparing distribution artifacts"
      ./gradlew prepareArtifacts --no-daemon
      echo "--- :file_folder: Contents of distribution:"
      ls -lhR build/distribution/
      echo "--- :arrow_up: Uploading distribution"
      buildkite-agent artifact upload "build/distribution/**/*"
    plugins:
      - docker#v5.8.0:
          image: gradle:8.5-jdk17
          volumes:
            - gradle-cache:/home/gradle/.gradle
          workdir: /workspace
      - artifacts#v1.9.0:
          download:
            - "build/libs/*.jar"
            - "build/reports/**/*"
    artifact_paths:
      - "build/distribution/**/*"
    timeout_in_minutes: 10

  - label: ":arrow_down: Download & Verify Artifacts"
    key: "verify-artifacts"
    depends_on: "package"
    command: |
      echo "--- :arrow_down: Downloading artifacts"
      buildkite-agent artifact download "build/distribution/*.jar" .
      echo "--- :white_check_mark: Verifying JAR integrity"
      ls -lh build/distribution/*.jar
      file build/distribution/*.jar
      unzip -l build/distribution/*.jar | head -20
      echo "--- :clipboard: Artifact verification complete"
    plugins:
      - docker#v5.8.0:
          image: gradle:8.5-jdk17
          workdir: /workspace
    timeout_in_minutes: 5

  - wait

  - label: ":memo: Generate Build Summary"
    key: "summary"
    command: |
      echo "--- :clipboard: Generating build summary"

      cat <<EOF | buildkite-agent annotate --style "success" --context "summary"
      ## :white_check_mark: Build Successful

      ### Build Information
      - **Build Number:** ${BUILDKITE_BUILD_NUMBER}
      - **Branch:** ${BUILDKITE_BRANCH}
      - **Commit:** ${BUILDKITE_COMMIT:0:7}
      - **Message:** ${BUILDKITE_MESSAGE}

      ### Artifacts
      - JAR file created and verified
      - Test reports available in artifacts
      - Code quality reports generated

      ### Test Results
      - Unit tests executed across 3 parallel shards
      - Integration tests completed with Docker Compose
      - Flaky test detection performed (3 iterations)

      ### Code Quality
      - Checkstyle analysis completed
      - PMD analysis completed
      - SpotBugs analysis completed

      ### Next Steps
      Deploy to staging environment or download artifacts for manual deployment.
      EOF

      echo "--- :tada: Build pipeline completed successfully!"
    timeout_in_minutes: 2

  - block: ":rocket: Deploy to Staging?"
    key: "deploy-gate"
    depends_on: "summary"
    prompt: "Ready to deploy to staging environment?"

  - label: ":rocket: Deploy to Staging"
    key: "deploy-staging"
    depends_on: "deploy-gate"
    command: |
      echo "--- :rocket: Deploying to staging environment"
      echo "This is a placeholder for actual deployment commands"
      echo "In production, this would deploy the application using:"
      echo "  - Kubernetes (kubectl apply)"
      echo "  - Cloud platforms (AWS ECS, GCP Cloud Run, Azure Container Apps)"
      echo "  - Traditional servers (SCP + systemd restart)"
      buildkite-agent artifact download "build/distribution/*.jar" .
      echo "--- :white_check_mark: Deployment simulation complete"
    plugins:
      - docker#v5.8.0:
          image: gradle:8.5-jdk17
          workdir: /workspace
    concurrency: 1
    concurrency_group: "staging-deployment"
    timeout_in_minutes: 15