pipeline:
  name: ZealousGradle - Multi-Framework Test Intelligence
  identifier: zealousgradle_multi_framework_ti
  projectIdentifier: your_project_id
  orgIdentifier: your_org_id
  tags: {}
  stages:
    - stage:
        name: Build and Test All Frameworks
        identifier: build_and_test_all
        type: CI
        spec:
          cloneCodebase: true
          platform:
            os: Linux
            arch: Amd64
          runtime:
            type: Cloud
            spec: {}
          execution:
            steps:
              - step:
                  type: RunTests
                  name: Run All Tests (JUnit + Cucumber + TestNG)
                  identifier: run_all_tests
                  spec:
                    connectorRef: account.harnessImage
                    # CRITICAL: Use Java 17 image for Spring Boot 3.2.0
                    image: gradle:8.5-jdk17
                    shell: Bash
                    language: Java
                    buildTool: Gradle
                    # Use --continue to generate reports even if tests fail
                    args: testAll --continue --no-daemon
                    packages: com.taskmanager
                    runOnlySelectedTests: true
                    preCommand: |-
                      # Verify Java version
                      echo "=== Java Version ==="
                      java -version

                      echo "=== Gradle Version ==="
                      ./gradlew --version

                      # Install Chrome for Selenium tests
                      echo "=== Installing Chrome ==="
                      apt-get update
                      apt-get install -y wget gnupg
                      wget -q -O - https://dl-ssl.google.com/linux/linux_signing_key.pub | apt-key add -
                      echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" >> /etc/apt/sources.list.d/google.list
                      apt-get update
                      apt-get install -y google-chrome-stable

                      # Verify Chrome installation
                      google-chrome --version
                    postCommand: |-
                      # Debug: Show generated reports
                      echo "=== JUnit Test Results ==="
                      find app/build/test-results/test -name "*.xml" -type f -ls || echo "No JUnit XML files found"

                      echo "=== Cucumber Test Results ==="
                      find app/build/test-results/cucumber -name "*.xml" -type f -ls || echo "No Cucumber XML files found"

                      echo "=== TestNG/Selenium Test Results ==="
                      find app/build/test-results/testng/junitreports -name "*.xml" -type f -ls || echo "No TestNG XML files found"

                      # List all XML files
                      echo "=== All Test Report Files ==="
                      find app/build/test-results -name "*.xml" -type f

                      # Archive Cucumber and TestNG HTML reports
                      mkdir -p /harness/test-reports
                      cp -r app/build/reports/cucumber/* /harness/test-reports/ 2>/dev/null || true
                      cp -r app/build/reports/testng/* /harness/test-reports/ 2>/dev/null || true
                    reports:
                      type: JUnit
                      spec:
                        paths:
                          # IMPORTANT: Include app/ prefix for multi-module project
                          - "app/build/test-results/test/*.xml"                      # JUnit tests (120)
                          - "app/build/test-results/cucumber/*.xml"                  # Cucumber tests (3)
                          - "app/build/test-results/testng/junitreports/*.xml"       # TestNG tests (9)
                    enableTestSplitting: false
