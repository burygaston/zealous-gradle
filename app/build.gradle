plugins {
    id 'java'
    id 'org.springframework.boot' version '3.2.0'
    id 'io.spring.dependency-management' version '1.1.4'
    id 'checkstyle'
    id 'pmd'
    id 'com.github.spotbugs' version '5.2.1'
}

group = 'com.taskmanager'
version = '1.0.0'

java {
    sourceCompatibility = '17'
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Multi-module dependencies
    implementation project(':common')

    // Spring Boot Starters
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-mail'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.thymeleaf.extras:thymeleaf-extras-springsecurity6'

    implementation 'org.apache.commons:commons-lang3:3.14.0'
    implementation 'com.google.guava:guava:32.1.2-jre'
    // Database
    runtimeOnly 'com.mysql:mysql-connector-j'
    runtimeOnly 'com.h2database:h2'

    // Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // MapStruct
    implementation 'org.mapstruct:mapstruct:1.5.5.Final'
    annotationProcessor 'org.mapstruct:mapstruct-processor:1.5.5.Final'
    annotationProcessor 'org.projectlombok:lombok-mapstruct-binding:0.2.0'

    // Jackson
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'

    // JWT
    implementation 'io.jsonwebtoken:jjwt-api:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.11.5'

    // SpotBugs annotations
    compileOnly 'com.github.spotbugs:spotbugs-annotations:4.8.0'

    // Testing
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'org.mockito:mockito-core'
    testImplementation 'org.mockito:mockito-junit-jupiter'

    // Cucumber BDD Testing
    testImplementation 'io.cucumber:cucumber-java:7.14.0'
    testImplementation 'io.cucumber:cucumber-junit-platform-engine:7.14.0'
    testImplementation 'org.junit.platform:junit-platform-suite:1.10.0'

    // Selenium WebDriver
    testImplementation 'org.seleniumhq.selenium:selenium-java:4.15.0'
    testImplementation 'io.github.bonigarcia:webdrivermanager:5.6.2'

    // TestNG
    testImplementation 'org.testng:testng:7.8.0'
}

tasks.named('test') {
    useJUnitPlatform()
    maxParallelForks = Runtime.runtime.availableProcessors().intdiv(2) ?: 1

    // Fail the build on test failures
    ignoreFailures = false

    testLogging {
        events "passed", "skipped", "failed"
        exceptionFormat "full"
        showStandardStreams = false
    }

    reports {
        junitXml.required = true
        html.required = true
    }

    // Configure Cucumber reports
    // Generate JUnit XML report in dedicated cucumber directory
    // This is SEPARATE from the standard JUnit test results
    systemProperty 'cucumber.plugin', 'pretty, html:build/reports/cucumber/cucumber-report.html, json:build/reports/cucumber/cucumber.json, junit:build/test-results/cucumber/cucumber.xml'
    systemProperty 'cucumber.publish.quiet', 'true'
}

checkstyle {
    toolVersion = '10.12.5'
    configFile = file("${rootDir}/app/config/checkstyle/checkstyle.xml")
    ignoreFailures = true
}

// Disable checkstyle, PMD, and SpotBugs for simplified builds
tasks.withType(Checkstyle) {
    enabled = false
}
tasks.withType(Pmd) {
    enabled = false
}
tasks.withType(com.github.spotbugs.snom.SpotBugsTask) {
    enabled = false
}

pmd {
    toolVersion = '6.55.0'
    ignoreFailures = true
    ruleSets = []
    ruleSetFiles = files("${rootDir}/app/config/pmd/ruleset.xml")
}

spotbugs {
    toolVersion = '4.8.0'
    ignoreFailures = true
}

task prepareArtifacts(type: Copy) {
    dependsOn build
    from("${buildDir}/libs") {
        include '*.jar'
    }
    from("${buildDir}/reports") {
        into 'reports'
    }
    into "${buildDir}/distribution"

    doLast {
        println "Artifacts prepared in ${buildDir}/distribution"
    }
}

tasks.withType(JavaCompile) {
    options.compilerArgs << '-parameters'
}

// TestNG task for Selenium tests
task testng(type: Test) {
    description = 'Run TestNG tests (Selenium UI tests)'
    group = 'verification'

    // Don't fail the build on test failures - let --continue handle it
    ignoreFailures = true

    useTestNG() {
        // Use testng.xml suite file if present
        suites file('src/test/resources/testng.xml')

        // Generate JUnit XML reports for Harness TI
        useDefaultListeners = true
        outputDirectory = file("$buildDir/test-results/testng")
    }

    testLogging {
        events "passed", "skipped", "failed"
        exceptionFormat "full"
        showStandardStreams = false
    }

    reports {
        junitXml.required = true
        junitXml.outputLocation = file("$buildDir/test-results/testng")
        html.required = true
        html.outputLocation = file("$buildDir/reports/testng")
    }

    // System properties for WebDriverManager
    systemProperty 'wdm.cachePath', "${System.getProperty('user.home')}/.cache/selenium"
    systemProperty 'webdriver.chrome.driver', ''

    // Only include Selenium/UI tests (opposite of test task excludes)
    include '**/*SeleniumTest*'
    include '**/*UITest*'
}

// Exclude TestNG tests from JUnit test task
test {
    exclude '**/*SeleniumTest*'
    exclude '**/*UITest*'
}

// Task to run all tests (JUnit + Cucumber + TestNG)
// Both tasks run independently even if one fails (due to --continue flag)
task testAll {
    description = 'Run all tests: JUnit, Cucumber, and TestNG'
    group = 'verification'
    dependsOn test, testng

    // Ensure testng runs after test completes (even on failure)
    testng.mustRunAfter test

    doLast {
        println "\n========================================="
        println "All test suites completed"
        println "- JUnit + Cucumber: app/build/test-results/test/"
        println "- Cucumber XML: app/build/test-results/cucumber/"
        println "- TestNG: app/build/test-results/testng/"
        println "=========================================\n"
    }
}