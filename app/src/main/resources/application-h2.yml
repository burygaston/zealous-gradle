spring:
  application:
    name: task-manager

  main:
    allow-circular-references: true

  datasource:
    url: jdbc:h2:mem:taskmanager;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
    open-in-view: false
    defer-datasource-initialization: true

  h2:
    console:
      enabled: true
      path: /h2-console

  sql:
    init:
      mode: always
      schema-locations:
      data-locations: classpath:data-h2.sql

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:your-email@gmail.com}
    password: ${MAIL_PASSWORD:your-app-password}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
        transport:
          protocol: smtp

  thymeleaf:
    cache: false
    prefix: classpath:/templates/
    suffix: .html

server:
  port: 8080
  error:
    include-message: always
    include-stacktrace: never

app:
  scheduler:
    daily-report-cron: "0 0 18 * * ?"
    weekly-report-cron: "0 0 18 ? * FRI"
  security:
    jwt-secret: ${JWT_SECRET:mySecretKeyForJWTTokenGenerationAndValidation12345}

logging:
  level:
    com.taskmanager: DEBUG
    org.springframework.web: INFO
    org.springframework.security: INFO
    org.hibernate: INFO
