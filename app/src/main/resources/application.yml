spring:
  application:
    name: task-manager

  datasource:
    url: jdbc:mysql://localhost:3306/taskmanager?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: taskuser
    password: taskpass123
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
    open-in-view: false

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:your-email@gmail.com}
    password: ${MAIL_PASSWORD:your-app-password}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
        transport:
          protocol: smtp

  thymeleaf:
    cache: false
    prefix: classpath:/templates/
    suffix: .html

server:
  port: 8080
  error:
    include-message: always
    include-stacktrace: never

app:
  scheduler:
    daily-report-cron: "0 0 18 * * ?"
    weekly-report-cron: "0 0 18 ? * FRI"
  security:
    jwt-secret: ${JWT_SECRET:mySecretKeyForJWTTokenGenerationAndValidation12345}

logging:
  level:
    com.taskmanager: DEBUG
    org.springframework.web: INFO
    org.springframework.security: INFO
    org.hibernate: INFO